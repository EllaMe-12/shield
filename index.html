<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOTP Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { cursor: none !important; }

        /* Liquid Warm Fluid Background Mesh */
        @keyframes fluid-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .liquid-bg {
            background: linear-gradient(-45deg, #fff7ed, #fef3c7, #ffedd5, #fae8ff, #fef9c3);
            background-size: 400% 400%;
            animation: fluid-flow 16s ease infinite;
        }

        /* Custom Shiny Cursor */
        #magic-cursor {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* Ambient Wave Lines */
        @keyframes wave-float {
            0%, 100% { transform: translateY(0px) scaleY(1); }
            50% { transform: translateY(-15px) scaleY(1.05); }
        }
        .animate-wave-slow { animation: wave-float 8s ease-in-out infinite; }
        .animate-wave-fast { animation: wave-float 5s ease-in-out infinite reverse; }
    </style>
</head>
<body class="liquid-bg text-amber-950 min-h-screen flex items-center justify-center p-4 font-sans select-none relative overflow-hidden">

    <!-- BACKGROUND SVG WAVE LINES -->
    <div class="fixed inset-0 pointer-events-none opacity-40 z-0 flex items-center justify-center overflow-hidden">
        <svg class="absolute w-[180%] h-[180%] text-amber-400/30 animate-wave-slow" viewBox="0 0 1440 600" fill="none">
            <path d="M0,160 C320,300 420,0 720,160 C1020,320 1120,60 1440,160 C1760,260 1860,20 2160,160" stroke="currentColor" stroke-width="2" fill="none" />
            <path d="M0,220 C300,60 450,340 750,220 C1050,100 1200,380 1500,220" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1.5" stroke-dasharray="8 8" fill="none" />
        </svg>
        <svg class="absolute w-[180%] h-[180%] text-orange-400/30 animate-wave-fast" viewBox="0 0 1440 600" fill="none">
            <path d="M0,320 C280,120 500,420 800,280 C1100,140 1280,360 1600,240" stroke="currentColor" stroke-width="2.5" fill="none" />
            <path d="M0,400 C340,200 480,480 820,360 C1160,240 1300,500 1640,380" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5" fill="none" />
        </svg>
    </div>

    <!-- CANVAS & SHINY CURSOR -->
    <canvas id="sparkle-canvas" class="fixed inset-0 pointer-events-none z-[9998]"></canvas>
    <div id="magic-cursor" class="w-5 h-5 rounded-full bg-amber-400/90 border border-white shadow-[0_0_15px_#f59e0b] backdrop-blur-sm"></div>

    <!-- MAIN APP CONTAINER -->
    <div class="relative w-full max-w-md bg-white/80 border border-amber-200/80 rounded-3xl p-6 shadow-[0_25px_60px_-15px_rgba(217,119,6,0.2)] backdrop-blur-xl z-10 space-y-6">
        
        <!-- HEADER -->
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-gradient-to-tr from-amber-400 to-orange-400 text-white rounded-2xl shadow-md mb-1">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-amber-950">Secure WebOTP Gateway</h1>
            <p class="text-xs text-amber-700">Warm Isolated Sandbox</p>
        </div>

        <!-- NOTIFICATION BANNER -->
        <div id="status-box" class="hidden p-3 rounded-2xl text-xs font-semibold border backdrop-blur-md transition-all"></div>

        <!-- AUTHENTICATION GATE (STEP 1: LOGIN / REGISTER) -->
        <div id="auth-gate" class="space-y-4">
            <div class="space-y-2">
                <label class="block text-xs font-bold text-amber-900">Email Address</label>
                <input type="email" id="auth-email" value="user@shield.io" placeholder="name@example.com" class="w-full bg-white/90 border border-amber-200 rounded-xl px-3.5 py-2.5 text-xs text-amber-950 focus:outline-none focus:border-amber-500 transition-colors shadow-sm">
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-amber-900">Password</label>
                <input type="password" id="auth-pass" value="••••••••" placeholder="Password" class="w-full bg-white/90 border border-amber-200 rounded-xl px-3.5 py-2.5 text-xs text-amber-950 focus:outline-none focus:border-amber-500 transition-colors shadow-sm">
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="handleAuth('Sign In')" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-xl text-xs font-semibold shadow-md transition-all active:scale-[0.98]">
                    Sign In
                </button>
                <button onclick="handleAuth('Register')" class="w-full py-2.5 bg-white hover:bg-amber-100 text-amber-900 rounded-xl text-xs font-semibold border border-amber-200 transition-all active:scale-[0.98] shadow-sm">
                    Register
                </button>
            </div>
        </div>

        <!-- PROTECTED DASHBOARD (STEP 2: OTP FUNCTIONALITY) -->
        <div id="protected-dashboard" class="hidden space-y-5">
            <div class="flex items-center justify-between bg-amber-100/60 p-3 rounded-2xl border border-amber-200">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="user-display" class="text-xs font-bold text-amber-950">user@shield.io</span>
                </div>
                <button onclick="logout()" class="text-xs text-amber-700 hover:text-rose-600 font-medium">Log Out</button>
            </div>

            <!-- SIMULATED OTP GENERATION -->
            <div class="bg-amber-50/80 p-4 rounded-2xl border border-amber-200/80 space-y-3">
                <div class="flex justify-between items-center text-xs">
                    <span class="text-amber-800 font-semibold">Simulated OTP Delivery</span>
                    <span id="generated-code" class="font-mono text-amber-600 font-bold tracking-wider">------</span>
                </div>
                <button onclick="requestNewOtp()" class="w-full py-2 bg-white hover:bg-amber-100 text-amber-900 text-xs font-semibold rounded-xl border border-amber-200 transition-all shadow-sm">
                    Generate Code
                </button>
            </div>

            <!-- VERIFICATION FORM -->
            <div class="space-y-3">
                <label class="block text-xs font-bold text-amber-900">Enter Verification Code</label>
                <input type="text" id="otp-input" maxlength="6" placeholder="000000" 
                       class="w-full bg-white border border-amber-200 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest text-amber-950 focus:outline-none focus:border-amber-500 transition-colors shadow-sm">
                
                <button onclick="verifyOtpCode()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-xs font-bold text-white rounded-xl shadow-md transition-all active:scale-[0.98]">
                    Verify & Authorize
                </button>
            </div>
        </div>

    </div>

    <script>
        // SPARKLE CURSOR TRAIL
        const cursor = document.getElementById('magic-cursor');
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        window.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;

            for(let i = 0; i < 2; i++) {
                particles.push({
                    x: e.clientX,
                    y: e.clientY,
                    size: Math.random() * 3 + 1,
                    color: `hsl(${Math.random() * 40 + 20}, 100%, 60%)`,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    life: 1
                });
            }
        });

        function animateSparkles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if(p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                }
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // APP LOGIC
        const API_BASE = "http://localhost:8080/api/auth";

        function handleAuth(action) {
            const email = document.getElementById('auth-email').value;
            if(!email) {
                showStatus("Please enter an email address.", "error");
                return;
            }
            document.getElementById('user-display').innerText = email;
            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('protected-dashboard').classList.remove('hidden');
            showStatus(`${action} successful! Welcome back.`, "success");
        }

        function logout() {
            document.getElementById('protected-dashboard').classList.add('hidden');
            document.getElementById('auth-gate').classList.remove('hidden');
            showStatus("Logged out successfully.", "success");
        }

        async function requestNewOtp() {
            try {
                const response = await fetch(`${API_BASE}/generate-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 'user-session-1' })
                });
                const data = await response.json();
                
                document.getElementById('generated-code').innerText = data.otp;
                showStatus("New verification code generated.", "success");
            } catch (err) {
                showStatus("Error connecting to backend service.", "error");
            }
        }

        async function verifyOtpCode() {
            const inputVal = document.getElementById('otp-input').value.trim();
            if (!inputVal) {
                showStatus("Please enter a code.", "error");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 'user-session-1', otp: inputVal })
                });
                const data = await response.json();

                if (data.success) {
                    showStatus(data.message, "success");
                } else {
                    showStatus(data.message, "error");
                }
            } catch (err) {
                showStatus("Verification failed.", "error");
            }
        }

        function showStatus(msg, type) {
            const box = document.getElementById('status-box');
            box.classList.remove('hidden', 'bg-emerald-100', 'border-emerald-300', 'text-emerald-900', 'bg-rose-100', 'border-rose-300', 'text-rose-900');
            
            if (type === 'success') {
                box.classList.add('bg-emerald-100', 'border-emerald-300', 'text-emerald-900');
            } else {
                box.classList.add('bg-rose-100', 'border-rose-300', 'text-rose-900');
            }
            
            box.innerText = msg;
        }

let localOtpStore = null;

function handleAuth(action) {
    const email = document.getElementById('auth-email').value;
    if (!email) {
        showStatus("Please enter an email address.", "error");
        return;
    }
    document.getElementById('user-display').innerText = email;
    document.getElementById('auth-gate').classList.add('hidden');
    document.getElementById('protected-dashboard').classList.remove('hidden');
    showStatus(`${action} successful! Welcome.`, "success");
}

function logout() {
    document.getElementById('protected-dashboard').classList.add('hidden');
    document.getElementById('auth-gate').classList.remove('hidden');
    showStatus("Logged out successfully.", "success");
}

function requestNewOtp() {
    // Generate a random 6-digit code locally
    localOtpStore = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('generated-code').innerText = localOtpStore;
    showStatus("New verification code generated.", "success");
}

function verifyOtpCode() {
    const inputVal = document.getElementById('otp-input').value.trim();
    if (!inputVal) {
        showStatus("Please enter a code.", "error");
        return;
    }

    if (localOtpStore && inputVal === localOtpStore) {
        localOtpStore = null; // Single-use OTP
        showStatus("Authorization successful! Code verified.", "success");
    } else {
        showStatus("Invalid or expired authorization code.", "error");
    }
}

function showStatus(msg, type) {
    const box = document.getElementById('status-box');
    box.classList.remove('hidden', 'bg-emerald-100', 'border-emerald-300', 'text-emerald-900', 'bg-rose-100', 'border-rose-300', 'text-rose-900');
    
    if (type === 'success') {
        box.classList.add('bg-emerald-100', 'border-emerald-300', 'text-emerald-900');
    } else {
        box.classList.add('bg-rose-100', 'border-rose-300', 'text-rose-900');
    }
    
    box.innerText = msg;
}
    </script>
</body>
</html>
